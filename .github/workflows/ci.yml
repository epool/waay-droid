# Quality gates for every change (constitution VIII, ADR-011). Runner images and their Xcode,
# simulator and JDK sets are documented in github.com/actions/runner-images.
#
# Speed (T113): the Gradle cache is written on trunk pushes; ~/.konan is cached; the iOS 17.5 runtime
# downloads while the app builds; Kotlin/Native shared tests run on the
# short macOS job, off the iOS critical path; the iOS UI tests run in two parallel shards.
name: CI

on:
  push:
    branches: [kmp, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android — format, lint, tests, coverage, build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # JDK 21 launches Gradle; the daemon JDK 25 is provisioned from gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # setup-gradle only writes its cache on the default branch unless told otherwise; trunk pushes
      # (kmp, master) write it, pull requests read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check, test and build
        run: >
          ./gradlew
          spotlessCheck
          :androidApp:lintDebug
          :shared:testAndroidHostTest
          :androidApp:testDebugUnitTest
          :shared:koverVerify
          :androidApp:assembleDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            androidApp/build/reports/
            shared/build/reports/

  macos-gradle:
    # Gradle work that needs a Mac, kept off the Xcode jobs' critical path:
    # - Kotlin/Native shared tests on the iOS simulator;
    # - the Roborazzi baselines, verified on the host type that recorded them (macOS arm64), since
    #   native-graphics rendering can differ by host OS and architecture (ADR-011).
    name: Shared iOS tests and Android screenshots (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Kotlin 2.4.20 is tested against Xcode 26.4 (ADR-000); macos-26 ships it side by side.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Shared tests on the iOS simulator and Roborazzi baselines
        run: ./gradlew :shared:iosSimulatorArm64Test :androidApp:verifyRoborazziDebug
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diffs
          path: androidApp/build/outputs/roborazzi/

  ios:
    # The UI tests run in two parallel shards to halve the job's wall time (ADR-011, T113). Shard "a"
    # takes the slowest classes; shard "b" runs everything else, so new test classes land there.
    name: iOS — app and UI tests (${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            tests: >-
              -only-testing:WaayUITests/AccessibilitySemanticsUITests
              -only-testing:WaayUITests/AccessibilityUITests
              -only-testing:WaayUITests/GameFlowUITests
          - shard: b
            tests: >-
              -skip-testing:WaayUITests/AccessibilitySemanticsUITests
              -skip-testing:WaayUITests/AccessibilityUITests
              -skip-testing:WaayUITests/GameFlowUITests
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Swift format
        if: matrix.shard == 'a'
        run: scripts/swift-format-lint.sh
      - name: Regenerate the Xcode project from project.yml
        run: |
          brew install xcodegen
          xcodegen --spec iosApp/project.yml
      # Built for a generic arm64 simulator, then booted: on a 3-core runner, booting during the build
      # only slowed the build by as much as it saved (measured, ADR-011).
      - name: Build the app and tests
        run: >
          xcodebuild build-for-testing
          -project iosApp/iosApp.xcodeproj
          -scheme Waay
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          ARCHS=arm64
          COMPILER_INDEX_STORE_ENABLE=NO
      - name: Boot an iPhone 17 on the newest iOS runtime
        run: |
          udid=$(scripts/ci-boot-simulator.sh 'iPhone 17')
          xcrun simctl bootstatus "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      # One retry per failed test: shared runners occasionally lose the simulator's app list ("Failed to
      # get list of active applications"). A real failure fails both attempts.
      - name: App and UI tests
        run: >
          xcodebuild test-without-building
          -project iosApp/iosApp.xcodeproj
          -scheme Waay
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -derivedDataPath build/DerivedData
          -resultBundlePath build/Waay-${{ matrix.shard }}.xcresult
          -collect-test-diagnostics never
          -retry-tests-on-failure
          -test-iterations 2
          ${{ matrix.tests }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult-${{ matrix.shard }}
          path: build/Waay-${{ matrix.shard }}.xcresult

  ios-minimum-os:
    # FR-030: the full suite on the minimum supported OS. No runner image preinstalls an iOS 17
    # runtime, so it is downloaded (~7 GB), in the background while the app builds. Skipped on pull
    # requests to keep them fast.
    name: iOS 17.5 — minimum OS
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Start downloading the iOS 17.5 simulator runtime
        run: nohup xcodebuild -downloadPlatform iOS -buildVersion 17.5 > "$RUNNER_TEMP/ios17-runtime.log" 2>&1 &
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # A generic destination needs no installed runtime; arm64 only, like the Kotlin framework.
      - name: Build the app and tests
        run: >
          xcodebuild build-for-testing
          -project iosApp/iosApp.xcodeproj
          -scheme Waay
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          ARCHS=arm64
          COMPILER_INDEX_STORE_ENABLE=NO
      - name: Wait for the runtime, then boot an iPhone 15 on iOS 17.5
        timeout-minutes: 20
        run: |
          until xcrun simctl list runtimes | grep -q "iOS 17.5"; do
            if ! pgrep -f "downloadPlatform iOS" > /dev/null; then
              xcrun simctl list runtimes | grep -q "iOS 17.5" && break
              # The background attempt can fail if it starts before CoreSimulator is ready
              # ("Unable to connect to simulator"); retry once in the foreground.
              cat "$RUNNER_TEMP/ios17-runtime.log"
              echo "::warning::Background runtime download failed; retrying in the foreground"
              xcodebuild -downloadPlatform iOS -buildVersion 17.5
              break
            fi
            sleep 10
          done
          xcrun simctl list runtimes | grep -q "iOS 17.5" || { echo "::error::iOS 17.5 runtime not installed"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/ios17-runtime.log"
          udid=$(xcrun simctl create "iPhone 15 (iOS 17.5)" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-15 \
            com.apple.CoreSimulator.SimRuntime.iOS-17-5)
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: App and UI tests on iOS 17.5
        run: >
          xcodebuild test-without-building
          -project iosApp/iosApp.xcodeproj
          -scheme Waay
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -derivedDataPath build/DerivedData
          -resultBundlePath build/Waay-ios17.xcresult
          -collect-test-diagnostics never
          -retry-tests-on-failure
          -test-iterations 2
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios17-xcresult
          path: build/Waay-ios17.xcresult
